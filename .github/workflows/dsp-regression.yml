name: DSP regression

on:
  push:
    branches:
      - main
      - fix/stft-ring-buffer-memory-safety
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMSC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build --output-on-failure
